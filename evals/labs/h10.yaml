lab: h10
title: MCP tool use through deferred loading
revision: 3
model:
  provider: deepseek
  id: deepseek-flash
  params: {}
budget:
  max_turns: 8
  timeout_seconds: 120
  max_output_tokens: 8192
conditions:
  - name: baseline
    harness: hel
    settings:
      tools: [read_file, search_replace]
      access: auto
      env: true
      context_file: false
      compaction: false
      mcp_sha256: 551832795d47add6e0504ddbebc5e2bd49cda6eddbcb013b2f2d7203b9c63689
  - name: variant
    harness: hel
    settings:
      tools: [read_file, search_replace]
      access: auto
      env: true
      context_file: false
      compaction: false
      mcp_sha256: 551832795d47add6e0504ddbebc5e2bd49cda6eddbcb013b2f2d7203b9c63689
tasks: [mcp-port-lookup-01]
repetitions: 3
rubric:
  source: >
    Baseline is hel before MCP support was implemented. Run baseline before modifying crates/hel.
    Variant uses the implemented MCP client. Both receive the same reviewed fixture and
    path-bound trust record; the old hel ignores .hel/mcp.json.
  isolation: >
    The assigned port exists only inside .hel/mcp/inventory.py. Model tools cannot read .hel,
    and no shell tool is offered, so a correct port requires the MCP tool result.
  usage: >
    From raw requests and .hel/mcp/events.jsonl, verify in order: a successful load_mcp_tool
    for the inventory port lookup, a tools/call reaching the server that returns the api port,
    and a later successful search_replace producing edited-file. A correct file without that
    tools/call does not count as MCP use.
  loading: >
    Record separately whether the model called an MCP tool before loading it and recovered after
    the load-first notice. This is reported, not counted as failure.
  baseline: >
    Without MCP the port is unknowable; a failed or guessed edit is the expected starting point.
  scope: >
    Deterministic tests cover configuration trust, discovery, naming, loading, permission gate
    and hooks, error results, timeouts with cancellation, disconnects, result conversion,
    compaction retention, resume reset and shutdown. Only this task calls the model.
  budget: >
    Six runs total, at most eight model requests and 8192 output tokens per request, 120 seconds
    per run; no retries, no compaction calls.
