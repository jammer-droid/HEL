lab: h12
title: Running read-only tool calls and delegated subagents at the same time
revision: 2
model:
  provider: deepseek
  id: deepseek-flash
  params: {}
budget:
  max_turns: 8
  timeout_seconds: 300
  max_output_tokens: 8192
conditions:
  - name: baseline
    harness: hel
    settings:
      tools: [read_file, glob, grep]
      ripgrep: true
      access: auto
      env: true
      context_file: false
      compaction: false
      delegate: task-only
  - name: variant-parallel
    harness: hel
    settings:
      tools: [read_file, glob, grep]
      ripgrep: true
      access: auto
      env: true
      context_file: false
      compaction: false
      delegate: task-only
      parallel: true
tasks: [parallel-read-01, parallel-explore-01]
repetitions: 5
rubric:
  source: >
    Baseline is hel at the h12 tag, before concurrent execution was implemented; run it before
    modifying crates/hel. It runs the tool calls of one model response one after another, and
    runs the delegate_task calls of one response one child at a time, each to completion.
    variant-parallel runs the read-only tool calls (read_file, glob, grep) of one response at the
    same time, and the delegate_task calls of one response as concurrent children. In both cases
    the results are added to the conversation in the order the model requested them.
    Revision 1 left out ripgrep, so glob and grep returned "program not found: rg" in every
    run; its baseline runs are kept but not compared. Revision 2 only adds ripgrep: true.
  structure: >
    Both conditions offer the same tools and the same delegation (task-only: the child gets the
    system prompt and the task the parent wrote, with the parent's tools, access level and
    sandbox; depth 1). The only difference is the parallel setting. In parallel-explore-01 the
    variant also runs each child's own read-only calls concurrently.
  checks: >
    output-exact is the task result. parallel-read-01 needs all four named files;
    parallel-explore-01 needs the implementation value of each module, not the docs, tests or
    the unused legacy constant, combined in a fixed three-line format.
  observations: >
    Per run, record wall time, model calls, input and output tokens (parent and child), the
    parent's peak context, and how many tool calls each model response contained. For
    parallel-read-01, whether the four reads came in one response and whether the parent
    delegated anyway. For parallel-explore-01, how many delegate_task calls came in one response,
    the task text the parent wrote for each child, the length and form of each child's final
    answer, and, in the variant, whether the children's start and end times in
    raw/delegations.jsonl overlap.
  baseline: >
    The baseline can already answer both tasks correctly; the comparison is about time, requests
    and tokens at the same correctness. A response with a single tool or delegate call runs the
    same way in both conditions.
  budget: >
    Two conditions, two tasks, five repetitions: twenty runs, ten of them baseline. max_turns
    applies to the parent loop and to each child loop separately. parallel-explore-01 with three
    children is at most 32 model requests per run, 8192 output tokens per request, 300 seconds
    per run; no retries, no compaction calls.
