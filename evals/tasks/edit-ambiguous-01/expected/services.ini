; Service connection settings.
; Every service retries failed connections the number of times given by `retries`.

[api]
host = 0.0.0.0
port = 8080
retries = 3
timeout = 10

[database]
host = db.internal
port = 5432
retries = 5
timeout = 10
pool_size = 20

[cache]
host = cache.internal
port = 6379
retries = 3
timeout = 2

[queue]
url = amqp://queue.internal:5672//
retries = 3
timeout = 30
prefetch = 10

[worker]
concurrency = 4
retries = 3
timeout = 300
