<svg xmlns="http://www.w3.org/2000/svg" width="736" height="430" viewBox="0 0 736 430" role="img" aria-labelledby="title desc"><title id="title">압축 후 model 입력 구성</title><desc id="desc">압축 후 model 입력 구성。기존 대화를 요약하고 별도 보관한 skill 본문을 최근 호출 순으로 skill당 5000, 합계25000 token 이내에서 포함한다.</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;fill:#24313d;font-size:14px}.title{font-size:16px;font-weight:600}.muted{fill:#536372}.line{fill:none;stroke:#778594;stroke-width:1.5}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#778594" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><rect x="0" y="4" width="340" height="176" rx="8" fill="#fff" stroke="#cbd4de"/><rect x="0" y="4" width="340" height="38" rx="8" fill="#e4efff" stroke="#cbd4de"/><text x="12" y="29" class="title" text-anchor="start">① 압축 전 model 입력</text><text x="12" y="68" class="" text-anchor="start">1. system: skill 목록</text><text x="12" y="95" class="" text-anchor="start">2~N. 대화 · tool 결과</text><text x="12" y="122" class="" text-anchor="start">여러 skill 본문 포함</text><rect x="396" y="4" width="340" height="176" rx="8" fill="#fff" stroke="#cbd4de"/><rect x="396" y="4" width="340" height="38" rx="8" fill="#e4efff" stroke="#cbd4de"/><text x="408" y="29" class="title" text-anchor="start">② 압축 후 model 입력</text><text x="408" y="68" class="" text-anchor="start">1. system: skill 목록</text><text x="408" y="95" class="" text-anchor="start">2. 이전 대화의 요약</text><text x="408" y="122" class="" text-anchor="start">3. 보존할 skill 본문 영역</text><text x="408" y="149" class="" text-anchor="start">4~N. 보존한 최근 대화</text><path d="M342 90 L394 90" class="line" marker-end="url(#arrow)"/><rect x="0" y="230" width="340" height="188" rx="8" fill="#e5f3eb" stroke="#cbd4de"/><text x="16" y="258" class="title" text-anchor="start">별도 skill 보관 데이터</text><text x="16" y="288" class="" text-anchor="start">각 skill의 최신 전달 본문</text><text x="16" y="315" class="" text-anchor="start">최근 호출 순서</text><text x="16" y="342" class="" text-anchor="start">A → B → C → D → E → F</text><path d="M342 316 L394 316" class="line" marker-end="url(#arrow)"/><rect x="396" y="230" width="340" height="188" rx="8" fill="#e4efff" stroke="#cbd4de"/><text x="412" y="258" class="title" text-anchor="start">skill 보존 영역 구성</text><text x="412" y="288" class="" text-anchor="start">최근 호출 순으로 본문 앞부분 선택</text><text x="412" y="315" class="" text-anchor="start">skill당 최대 5,000 token</text><text x="412" y="342" class="" text-anchor="start">합계 최대 25,000 token</text><text x="412" y="369" class="" text-anchor="start">예산 소진 후 나머지 skill 제외</text><path d="M566 228 L566 178" class="line" marker-end="url(#arrow)"/></svg>
