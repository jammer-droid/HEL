<svg xmlns="http://www.w3.org/2000/svg" width="736" height="442" viewBox="0 0 736 442" role="img" aria-labelledby="title desc"><title id="title">압축과 세션 재개 때 MCP tool 정의의 위치</title><desc id="desc">압축과 세션 재개 때 MCP tool 정의의 위치. 압축은 메시지만 요약하고 tools 배열의 로딩한 정의는 그대로 둔다. 세션을 재개하면 snapshot의 대화만 복원하고, 신뢰한 mcp.json의 서버에 다시 연결해 받은 목록을 시스템 프롬프트에 넣는다. tools 배열은 처음 실행과 같이 built-in과 로딩 tool만 두고, MCP 정의는 다시 로딩할 때 추가한다.</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;fill:#24313d;font-size:14px}.title{font-size:16px;font-weight:600}.sec{font-size:13px;font-weight:600;fill:#536372}.muted{fill:#536372}.new{fill:#1f6b3a;font-weight:600}.line{fill:none;stroke:#778594;stroke-width:1.5}.dash{fill:none;stroke:#778594;stroke-width:1.5;stroke-dasharray:4 3}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#778594" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><rect x="0" y="12" width="228" height="268" rx="8" fill="#fff" stroke="#cbd4de"/><rect x="0" y="12" width="228" height="38" rx="8" fill="#e4efff" stroke="#cbd4de"/><text x="12" y="37" class="title" text-anchor="start">① 압축 전</text><text x="12" y="74" class="sec" text-anchor="start">메시지</text><text x="12" y="99" class="" text-anchor="start">1. system: MCP tool 목록</text><text x="12" y="124" class="" text-anchor="start">2~6. 로딩 · 호출 대화</text><text x="12" y="149" class="" text-anchor="start">7~. 후속 대화</text><path d="M12 164 L216 164" stroke="#cbd4de"/><text x="12" y="184" class="sec" text-anchor="start">tools 배열</text><text x="12" y="209" class="" text-anchor="start">built-in · load_mcp_tool</text><text x="12" y="234" class="" text-anchor="start">mcp__notes__search</text><rect x="254" y="12" width="228" height="268" rx="8" fill="#fff" stroke="#cbd4de"/><rect x="254" y="12" width="228" height="38" rx="8" fill="#e4efff" stroke="#cbd4de"/><text x="266" y="37" class="title" text-anchor="start">② 압축 후</text><text x="266" y="74" class="sec" text-anchor="start">메시지</text><text x="266" y="99" class="" text-anchor="start">1. system: MCP tool 목록</text><text x="266" y="124" class="" text-anchor="start">2. 요약</text><text x="266" y="149" class="" text-anchor="start">3~. 최근 내역</text><path d="M266 164 L470 164" stroke="#cbd4de"/><text x="266" y="184" class="sec" text-anchor="start">tools 배열</text><text x="266" y="209" class="" text-anchor="start">built-in · load_mcp_tool</text><text x="266" y="234" class="new" text-anchor="start">mcp__notes__search 유지</text><rect x="508" y="12" width="228" height="268" rx="8" fill="#fff" stroke="#cbd4de"/><rect x="508" y="12" width="228" height="38" rx="8" fill="#e4efff" stroke="#cbd4de"/><text x="520" y="37" class="title" text-anchor="start">③ 세션 재개 후</text><text x="520" y="74" class="sec" text-anchor="start">메시지</text><text x="520" y="99" class="" text-anchor="start">1. system: MCP tool 목록</text><text x="520" y="124" class="" text-anchor="start">2~. 복원한 대화</text><path d="M520 139 L724 139" stroke="#cbd4de"/><text x="520" y="159" class="sec" text-anchor="start">tools 배열</text><text x="520" y="184" class="" text-anchor="start">built-in · load_mcp_tool</text><text x="520" y="209" class="muted" text-anchor="start">MCP 정의는 다시 로딩</text><path d="M230 140 L250 140" class="line" marker-end="url(#arrow)"/><path d="M484 140 L504 140" class="line" marker-end="url(#arrow)"/><rect x="254" y="326" width="228" height="104" rx="8" fill="#e5f3eb" stroke="#cbd4de"/><text x="270" y="352" class="title" text-anchor="start">snapshot</text><text x="270" y="379" class="" text-anchor="start">대화 기록만 복원</text><text x="270" y="404" class="" text-anchor="start">MCP 로딩 상태 없음</text><rect x="508" y="326" width="228" height="104" rx="8" fill="#fdf1dc" stroke="#cbd4de"/><text x="524" y="352" class="title" text-anchor="start">notes 서버 재연결</text><text x="524" y="379" class="" text-anchor="start">mcp.json 신뢰 확인</text><text x="524" y="404" class="" text-anchor="start">tools/list → MCP tool 목록</text><path d="M368 282 L368 324" class="line" marker-end="url(#arrow)"/><path d="M470 324 L540 284" class="line" marker-end="url(#arrow)"/><path d="M660 324 L660 284" class="line" marker-end="url(#arrow)"/></svg>