<svg xmlns="http://www.w3.org/2000/svg" width="736" height="700" viewBox="0 0 736 700" role="img" aria-labelledby="h10-diagram-title h10-diagram-desc"><style>text{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;font-size:16px;fill:#24313d;font-weight:400}.small{font-size:14px;fill:#536372}.label{font-weight:600}.core{fill:#eef1f4;stroke:none}.external{fill:#fff;stroke:#cad2db;stroke-width:1.5}.boundary{fill:none;stroke:#dbe1e7;stroke-width:1}.skills{fill:#e4efff;stroke:none}.hooks{fill:#fff0dc;stroke:none}.mcp{fill:#e4f3e9;stroke:none}.edge{fill:none;stroke:#758492;stroke-width:1.4}.edge.skills-edge{stroke:#4873b6}.edge.mcp-edge{stroke:#467e57}</style><rect width="100%" height="100%" fill="#fff"/><title id="h10-diagram-title">Skills·Hooks·MCP 연결</title><desc id="h10-diagram-desc">사용자 지시를 받아 model 입력을 준비하고 model 응답을 처리한다. tool 호출이면 권한 판단 후 실행하고 결과를 대화에 추가해 다시 요청한다. 최종 답은 사용자에게 전달한다. Skills는 목록을 시스템 프롬프트에 더하고 선택 후 본문을 읽으며, harness는 tool 실행 전후에 hook을 호출한다. MCP client는 외부 서버의 tool을 호출하고 결과를 받는다.</desc><defs><marker id="h10-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#758492" stroke-width="1.5"/></marker></defs><rect x="216" y="64" width="304" height="630" rx="8" class="boundary"/><text x="230" y="88" text-anchor="start" class="label">hel</text><rect x="284" y="4" width="168" height="36" rx="8" class="external"/><text x="368" y="29" text-anchor="middle" class="label">사용자 지시</text><path d="M368 40V100" class="edge " marker-end="url(#h10-arrow)"/><rect x="246" y="102" width="244" height="94" rx="8" class="core"/><text x="368" y="127" text-anchor="middle" class="label">model 입력 준비</text><text x="368" y="149" text-anchor="middle" class="small">시스템 프롬프트</text><text x="368" y="168" text-anchor="middle" class="small">사용 가능한 tool 목록 · 대화 기록</text><rect x="568" y="108" width="168" height="74" rx="8" class="external"/><text x="652" y="133" text-anchor="middle" class="label">model</text><text x="652" y="155" text-anchor="middle" class="small">다음 행동 생성</text><path d="M490 124H568" class="edge " marker-end="url(#h10-arrow)"/><text x="529" y="116" text-anchor="middle" class="small">요청</text><path d="M568 165H548V278H490" class="edge " marker-end="url(#h10-arrow)"/><text x="556" y="235" text-anchor="start" class="small">응답</text><rect x="246" y="256" width="244" height="74" rx="8" class="core"/><text x="368" y="281" text-anchor="middle" class="label">응답 처리</text><text x="368" y="303" text-anchor="middle" class="small">tool 호출 또는 최종 답</text><rect x="568" y="288" width="168" height="38" rx="8" class="external"/><text x="652" y="313" text-anchor="middle" class="label">사용자</text><path d="M490 308H568" class="edge " marker-end="url(#h10-arrow)"/><text x="529" y="299" text-anchor="middle" class="small">최종 답</text><path d="M368 330V362" class="edge " marker-end="url(#h10-arrow)"/><text x="378" y="352" text-anchor="start" class="small">tool 호출</text><rect x="246" y="362" width="244" height="40" rx="8" class="hooks"/><text x="368" y="387" text-anchor="middle" class="label">PreToolUse 호출</text><path d="M368 402V438" class="edge " marker-end="url(#h10-arrow)"/><rect x="246" y="438" width="244" height="92" rx="8" class="core"/><text x="368" y="462" text-anchor="middle" class="label">권한 판단</text><path d="M262 480H474" class="edge " /><text x="368" y="502" text-anchor="middle" class="label">tool 실행</text><text x="368" y="521" text-anchor="middle" class="small">내장 tool / MCP client</text><path d="M368 530V560" class="edge " marker-end="url(#h10-arrow)"/><rect x="246" y="560" width="244" height="40" rx="8" class="hooks"/><text x="368" y="585" text-anchor="middle" class="label">PostToolUse 호출</text><path d="M368 600V631" class="edge " marker-end="url(#h10-arrow)"/><rect x="246" y="631" width="244" height="44" rx="8" class="core"/><text x="368" y="656" text-anchor="middle" class="label">결과를 대화에 추가</text><path d="M246 653H228V176H246" class="edge " marker-end="url(#h10-arrow)"/><rect x="0" y="102" width="168" height="86" rx="8" class="skills"/><text x="84" y="127" text-anchor="middle" class="label">Skills</text><text x="84" y="149" text-anchor="middle" class="small">이름·설명·파일 위치</text><text x="84" y="168" text-anchor="middle" class="small">본문은 선택 후 로딩</text><path d="M168 139H246" class="edge skills-edge" marker-end="url(#h10-arrow)"/><rect x="568" y="442" width="168" height="108" rx="8" class="mcp"/><text x="652" y="467" text-anchor="middle" class="label">MCP 서버</text><text x="652" y="489" text-anchor="middle" class="small">외부 tool 실행</text><text x="652" y="511" text-anchor="middle" class="small">목록: 이름·설명 먼저</text><text x="652" y="531" text-anchor="middle" class="small">정의는 로딩 후 추가</text><path d="M490 488H568" class="edge mcp-edge" marker-end="url(#h10-arrow)"/><text x="529" y="478" text-anchor="middle" class="small">호출</text><path d="M568 516H490" class="edge mcp-edge" marker-end="url(#h10-arrow)"/><text x="529" y="549" text-anchor="middle" class="small">결과</text></svg>
