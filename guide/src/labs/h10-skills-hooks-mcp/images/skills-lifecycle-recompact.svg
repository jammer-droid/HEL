<svg xmlns="http://www.w3.org/2000/svg" width="736" height="480" viewBox="0 0 736 480" role="img" aria-labelledby="title desc"><title id="title">후속 대화 후 다시 압축</title><desc id="desc">후속 대화 후 다시 압축: 저장소 파일 v2, 내부 보관 본문 v2. 문맥의 skill 영역은 v2 앞부분. 최근 내역에는 전체 skill 본문 없음.</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;font-size:14px;fill:#24313d}.head{font-size:16px;font-weight:600}.small{font-size:13px;fill:#536372}.edge{stroke:#778594;stroke-width:1.4;fill:none}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#778594" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="8" y="20" class="small" text-anchor="start">review · 전체 본문 6,000 추정 token</text><rect x="0" y="34" width="340" height="84" rx="7" fill="#fff0dc"/><text x="12" y="60" class="head" text-anchor="start">저장소의 SKILL.md</text><text x="12" y="84" class="" text-anchor="start">본문 v2 · 전체 6,000 token</text><text x="12" y="106" class="small" text-anchor="start">.agents/skills/review/SKILL.md</text><rect x="396" y="34" width="340" height="84" rx="7" fill="#fff0dc"/><text x="408" y="60" class="head" text-anchor="start">harness 내부 보관 목록</text><text x="408" y="84" class="" text-anchor="start">review v2 전체 · hash B</text><text x="408" y="106" class="small" text-anchor="start">최근 호출 순위 1 · snapshot에 저장</text><text x="8" y="180" class="head" text-anchor="start">model context window</text><rect x="0" y="192" width="736" height="46" rx="7" fill="#eef1f4"/><text x="12" y="220" class="head" text-anchor="start">시스템 프롬프트</text><text x="724" y="220" class="" text-anchor="end">review 목록 정보</text><rect x="0" y="244" width="736" height="46" rx="7" fill="#eef1f4"/><text x="12" y="272" class="head" text-anchor="start">요약</text><text x="724" y="272" class="" text-anchor="end">갱신된 대화 요약</text><rect x="0" y="296" width="736" height="46" rx="7" fill="#fff0dc"/><text x="12" y="324" class="head" text-anchor="start">skill 본문 보존 영역</text><text x="724" y="324" class="" text-anchor="end">v2 앞부분 · 최대 5,000 token</text><rect x="0" y="348" width="736" height="46" rx="7" fill="#eef1f4"/><text x="12" y="376" class="head" text-anchor="start">최근 내역</text><text x="724" y="376" class="" text-anchor="end">최근 작업 대화</text><rect x="0" y="400" width="736" height="46" rx="7" fill="#eef1f4"/><text x="12" y="428" class="head" text-anchor="start">출력 예약</text><text x="724" y="428" class="" text-anchor="end">답변을 위한 공간 · 입력 메시지 아님</text><text x="8" y="472" class="small" text-anchor="start">v1 / v2: 본문 버전 · 이름·설명·경로는 동일</text></svg>
