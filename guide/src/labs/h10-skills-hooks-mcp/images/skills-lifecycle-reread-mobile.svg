<svg xmlns="http://www.w3.org/2000/svg" width="360" height="580" viewBox="0 0 360 580" role="img" aria-labelledby="title desc"><title id="title">변경된 skill 다시 읽기</title><desc id="desc">변경된 skill 다시 읽기: 저장소 파일 v2, 내부 보관 본문 v2. 문맥의 skill 영역은 v1 앞부분. 최근 tool 결과에는 v2 전체 본문.</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;font-size:14px;fill:#24313d}.head{font-size:16px;font-weight:600}.small{font-size:13px;fill:#536372}.edge{stroke:#778594;stroke-width:1.4;fill:none}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#778594" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="8" y="20" class="small" text-anchor="start">review · 전체 본문 6,000 추정 token</text><rect x="0" y="34" width="360" height="84" rx="7" fill="#fff0dc"/><text x="12" y="60" class="head" text-anchor="start">저장소의 SKILL.md</text><text x="12" y="84" class="" text-anchor="start">본문 v2 · 전체 6,000 token</text><text x="12" y="106" class="small" text-anchor="start">.agents/skills/review/SKILL.md</text><rect x="0" y="143" width="360" height="84" rx="7" fill="#fff0dc"/><text x="12" y="169" class="head" text-anchor="start">harness 내부 보관 목록</text><text x="12" y="193" class="" text-anchor="start">review v2 전체 · hash B</text><text x="12" y="215" class="small" text-anchor="start">최근 호출 순위 1 · snapshot에 저장</text><path d="M180 120L180 140" class="edge" marker-end="url(#arrow)"/><text x="8" y="280" class="head" text-anchor="start">model context window</text><rect x="0" y="292" width="360" height="46" rx="7" fill="#eef1f4"/><text x="12" y="310" class="small" text-anchor="start">시스템 프롬프트</text><text x="12" y="330" class="" text-anchor="start">review 목록 정보</text><rect x="0" y="344" width="360" height="46" rx="7" fill="#eef1f4"/><text x="12" y="362" class="small" text-anchor="start">요약</text><text x="12" y="382" class="" text-anchor="start">이전 대화 요약</text><rect x="0" y="396" width="360" height="46" rx="7" fill="#e4efff"/><text x="12" y="414" class="small" text-anchor="start">skill 본문 보존 영역</text><text x="12" y="434" class="" text-anchor="start">v1 앞부분 · 최대 5,000 token</text><rect x="0" y="448" width="360" height="46" rx="7" fill="#fff0dc"/><text x="12" y="466" class="small" text-anchor="start">최근 내역</text><text x="12" y="486" class="" text-anchor="start">tool 결과들 · v2 전체</text><rect x="0" y="500" width="360" height="46" rx="7" fill="#eef1f4"/><text x="12" y="518" class="small" text-anchor="start">출력 예약</text><text x="12" y="538" class="" text-anchor="start">답변을 위한 공간 · 입력 메시지 아님</text><text x="8" y="572" class="small" text-anchor="start">v1 / v2: 본문 버전 · 이름·설명·경로는 동일</text></svg>
