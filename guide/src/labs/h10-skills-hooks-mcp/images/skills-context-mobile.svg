<svg xmlns="http://www.w3.org/2000/svg" width="360" height="836" viewBox="0 0 360 836" role="img" aria-labelledby="title desc"><title id="title">skill 읽기 전후 model 입력</title><desc id="desc">skill 읽기 전후 model 입력。처음에는 목록, 읽은 뒤에는 본문, 같은 본문을 다시 요청하면 이미 로딩됨 안내가 포함된다. 읽은 본문은 별도로 보관한다.</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;fill:#24313d;font-size:14px}.title{font-size:16px;font-weight:600}.muted{fill:#536372}.line{fill:none;stroke:#778594;stroke-width:1.5}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#778594" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><rect x="8" y="8" width="344" height="204" rx="8" fill="#fff" stroke="#cbd4de"/><rect x="8" y="8" width="344" height="38" rx="8" fill="#e4efff" stroke="#cbd4de"/><text x="20" y="33" class="title" text-anchor="start">① 처음 model 입력</text><text x="20" y="72" class="" text-anchor="start">1. system: skill 목록 v1</text><text x="20" y="99" class="" text-anchor="start">2. user: 리뷰 요청</text><path d="M180 214 L180 248" class="line" marker-end="url(#arrow)"/><rect x="8" y="250" width="344" height="204" rx="8" fill="#fff" stroke="#cbd4de"/><rect x="8" y="250" width="344" height="38" rx="8" fill="#e4efff" stroke="#cbd4de"/><text x="20" y="275" class="title" text-anchor="start">② 첫 skill 읽기 후</text><text x="20" y="314" class="" text-anchor="start">1. system: skill 목록 v1</text><text x="20" y="341" class="" text-anchor="start">2. user: 리뷰 요청</text><text x="20" y="368" class="" text-anchor="start">3. assistant: read_file 요청</text><text x="20" y="395" class="" text-anchor="start">4. tool: review 본문 v1</text><path d="M180 456 L180 490" class="line" marker-end="url(#arrow)"/><rect x="8" y="492" width="344" height="204" rx="8" fill="#fff" stroke="#cbd4de"/><rect x="8" y="492" width="344" height="38" rx="8" fill="#e4efff" stroke="#cbd4de"/><text x="20" y="517" class="title" text-anchor="start">③ 같은 skill 재요청 후</text><text x="20" y="556" class="" text-anchor="start">1. system: skill 목록 v1</text><text x="20" y="583" class="" text-anchor="start">2~4. 이전 대화 · 본문 v1</text><text x="20" y="610" class="" text-anchor="start">5. assistant: read_file 요청</text><text x="20" y="637" class="" text-anchor="start">6. tool: 이미 로딩됨</text><rect x="8" y="744" width="344" height="80" rx="8" fill="#e5f3eb" stroke="#cbd4de"/><text x="22" y="772" class="title" text-anchor="start">별도 skill 보관 데이터</text><text x="22" y="799" class="" text-anchor="start">review 본문 v1 · 최근 호출 순서</text></svg>
