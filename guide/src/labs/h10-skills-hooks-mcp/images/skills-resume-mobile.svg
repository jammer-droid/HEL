<svg xmlns="http://www.w3.org/2000/svg" width="360" height="684" viewBox="0 0 360 684" role="img" aria-labelledby="title desc"><title id="title">세션 재개 시 v1 복원</title><desc id="desc">세션 재개 시 v1 복원。skill을 다시 읽을 때 v2 목록과 본문을 반영하고 보관 본문도 갱신한다.</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;fill:#24313d;font-size:14px}.title{font-size:16px;font-weight:600}.muted{fill:#536372}.line{fill:none;stroke:#778594;stroke-width:1.5}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#778594" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><rect x="8" y="8" width="344" height="70" rx="8" fill="#e5f3eb" stroke="#cbd4de"/><text x="22" y="35" class="title" text-anchor="start">snapshot: 목록·대화·보관 본문 v1</text><text x="22" y="59" class="" text-anchor="start">저장소 파일은 v2로 수정된 상태</text><path d="M180 80 L180 108" class="line" marker-end="url(#arrow)"/><rect x="8" y="110" width="344" height="198" rx="8" fill="#fff" stroke="#cbd4de"/><rect x="8" y="110" width="344" height="38" rx="8" fill="#e4efff" stroke="#cbd4de"/><text x="20" y="135" class="title" text-anchor="start">① 세션 재개 후 model 입력</text><text x="20" y="174" class="" text-anchor="start">1. system: 복원한 skill 목록 v1</text><text x="20" y="201" class="" text-anchor="start">2. user: 이전 리뷰 요청</text><text x="20" y="228" class="" text-anchor="start">3. assistant: 이전 읽기 요청</text><text x="20" y="255" class="" text-anchor="start">4. tool: review 본문 v1</text><path d="M180 310 L180 362" class="line" marker-end="url(#arrow)"/><text x="192" y="340" class="muted" text-anchor="start">read_file 재요청</text><rect x="8" y="364" width="344" height="198" rx="8" fill="#fff" stroke="#cbd4de"/><rect x="8" y="364" width="344" height="38" rx="8" fill="#e4efff" stroke="#cbd4de"/><text x="20" y="389" class="title" text-anchor="start">② 다시 읽은 뒤 model 입력</text><text x="20" y="428" class="" text-anchor="start">1. system: 갱신한 skill 목록 v2</text><text x="20" y="455" class="" text-anchor="start">2~4. 이전 대화 · 본문 v1</text><text x="20" y="482" class="" text-anchor="start">5. assistant: 다시 읽기 요청</text><text x="20" y="509" class="" text-anchor="start">6. tool: 최신 review 본문 v2</text><path d="M180 564 L180 598" class="line" marker-end="url(#arrow)"/><rect x="8" y="600" width="344" height="72" rx="8" fill="#e5f3eb" stroke="#cbd4de"/><text x="22" y="627" class="title" text-anchor="start">별도 보관 본문도 v2로 갱신</text><text x="22" y="653" class="" text-anchor="start">이전 대화는 유지 · 새 본문 추가</text></svg>
