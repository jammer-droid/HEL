<svg xmlns="http://www.w3.org/2000/svg" width="736" height="416" viewBox="0 0 736 416" role="img" aria-labelledby="title desc"><title id="title">MCP tool 로딩과 호출 전후의 model 입력</title><desc id="desc">MCP tool 로딩과 호출 전후의 model 입력. 처음에는 시스템 프롬프트에 목록만 있고 tools 배열에는 built-in과 로딩 tool만 있다. 로딩하면 tool 결과로 완료 안내가 들어가고 다음 요청부터 tools 배열에 해당 정의가 추가된다. 호출 결과는 서버 응답이 tool 메시지로 들어간다. 로딩한 이름은 harness가 따로 기록한다.</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;fill:#24313d;font-size:14px}.title{font-size:16px;font-weight:600}.sec{font-size:13px;font-weight:600;fill:#536372}.muted{fill:#536372}.new{fill:#1f6b3a;font-weight:600}.line{fill:none;stroke:#778594;stroke-width:1.5}.dash{fill:none;stroke:#778594;stroke-width:1.5;stroke-dasharray:4 3}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#778594" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><rect x="0" y="12" width="228" height="242" rx="8" fill="#fff" stroke="#cbd4de"/><rect x="0" y="12" width="228" height="38" rx="8" fill="#e4efff" stroke="#cbd4de"/><text x="12" y="37" class="title" text-anchor="start">① 처음 model 입력</text><text x="12" y="74" class="sec" text-anchor="start">메시지</text><text x="12" y="99" class="" text-anchor="start">1. system: MCP tool 목록</text><text x="12" y="124" class="" text-anchor="start">2. user: 메모 검색 요청</text><path d="M12 139 L216 139" stroke="#cbd4de"/><text x="12" y="159" class="sec" text-anchor="start">tools 배열</text><text x="12" y="184" class="" text-anchor="start">built-in · load_mcp_tool</text><rect x="254" y="12" width="228" height="242" rx="8" fill="#fff" stroke="#cbd4de"/><rect x="254" y="12" width="228" height="38" rx="8" fill="#e4efff" stroke="#cbd4de"/><text x="266" y="37" class="title" text-anchor="start">② 로딩 후</text><text x="266" y="74" class="sec" text-anchor="start">메시지</text><text x="266" y="99" class="" text-anchor="start">1~2. 목록 · 요청</text><text x="266" y="124" class="" text-anchor="start">3. assistant: load_mcp_tool</text><text x="266" y="149" class="" text-anchor="start">4. tool: 로딩 완료 안내</text><path d="M266 164 L470 164" stroke="#cbd4de"/><text x="266" y="184" class="sec" text-anchor="start">tools 배열</text><text x="266" y="209" class="" text-anchor="start">built-in · load_mcp_tool</text><text x="266" y="234" class="new" text-anchor="start">+ mcp__notes__search</text><rect x="508" y="12" width="228" height="242" rx="8" fill="#fff" stroke="#cbd4de"/><rect x="508" y="12" width="228" height="38" rx="8" fill="#e4efff" stroke="#cbd4de"/><text x="520" y="37" class="title" text-anchor="start">③ 호출 후</text><text x="520" y="74" class="sec" text-anchor="start">메시지</text><text x="520" y="99" class="" text-anchor="start">1~4. 이전 대화</text><text x="520" y="124" class="" text-anchor="start">5. assistant: search 호출</text><text x="520" y="149" class="" text-anchor="start">6. tool: 서버 결과</text><path d="M520 164 L724 164" stroke="#cbd4de"/><text x="520" y="184" class="sec" text-anchor="start">tools 배열</text><text x="520" y="209" class="" text-anchor="start">built-in · load_mcp_tool</text><text x="520" y="234" class="" text-anchor="start">mcp__notes__search</text><path d="M230 130 L250 130" class="line" marker-end="url(#arrow)"/><path d="M484 130 L504 130" class="line" marker-end="url(#arrow)"/><rect x="254" y="300" width="228" height="104" rx="8" fill="#e5f3eb" stroke="#cbd4de"/><text x="270" y="326" class="title" text-anchor="start">로딩 기록</text><text x="270" y="353" class="" text-anchor="start">mcp__notes__search</text><text x="270" y="378" class="" text-anchor="start">이 세션 안에서만 유지</text><path d="M368 256 L368 298" class="line" marker-end="url(#arrow)"/><rect x="508" y="300" width="228" height="104" rx="8" fill="#fdf1dc" stroke="#cbd4de"/><text x="524" y="326" class="title" text-anchor="start">notes 서버</text><text x="524" y="353" class="" text-anchor="start">권한 판단 · Hooks 뒤</text><text x="524" y="378" class="" text-anchor="start">tools/call 실행</text><path d="M622 256 L622 298" class="line" marker-end="url(#arrow)"/></svg>