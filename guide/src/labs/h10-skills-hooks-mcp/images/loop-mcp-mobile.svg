<svg xmlns="http://www.w3.org/2000/svg" width="360" height="912" viewBox="0 0 360 912" role="img" aria-labelledby="h10-diagram-title h10-diagram-desc"><style>text{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;font-size:16px;fill:#24313d;font-weight:400}.small{font-size:14px;fill:#536372}.label{font-weight:600}.core{fill:#eef1f4;stroke:none}.external{fill:#fff;stroke:#cad2db;stroke-width:1.5}.boundary{fill:none;stroke:#dbe1e7;stroke-width:1}.skills{fill:#e4efff;stroke:none}.hooks{fill:#fff0dc;stroke:none}.mcp{fill:#e4f3e9;stroke:none}.edge{fill:none;stroke:#758492;stroke-width:1.4}.edge.skills-edge{stroke:#4873b6}.edge.mcp-edge{stroke:#467e57}</style><rect width="100%" height="100%" fill="#fff"/><title id="h10-diagram-title">Skills·Hooks·MCP 연결</title><desc id="h10-diagram-desc">사용자 지시를 받아 model 입력을 준비하고 model 응답을 처리한다. tool 호출이면 권한 판단 후 실행하고 결과를 대화에 추가해 다시 요청한다. 최종 답은 사용자에게 전달한다. Skills는 목록을 시스템 프롬프트에 더하고 선택 후 본문을 읽으며, harness는 tool 실행 전후에 hook을 호출한다. MCP client는 외부 서버의 tool을 호출하고 결과를 받는다.</desc><defs><marker id="h10-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#758492" stroke-width="1.5"/></marker></defs><text x="180" y="24" text-anchor="middle" class="label">사용자 지시</text><path d="M180 30V54" class="edge " marker-end="url(#h10-arrow)"/><rect x="32" y="54" width="296" height="68" rx="8" class="skills"/><text x="180" y="79" text-anchor="middle" class="label">Skills</text><text x="180" y="101" text-anchor="middle" class="small">이름·설명·파일 위치</text><path d="M180 122V147" class="edge " marker-end="url(#h10-arrow)"/><rect x="32" y="148" width="296" height="94" rx="8" class="core"/><text x="180" y="173" text-anchor="middle" class="label">model 입력 준비</text><text x="180" y="195" text-anchor="middle" class="small">시스템 프롬프트</text><text x="180" y="214" text-anchor="middle" class="small">사용 가능한 tool 목록 · 대화 기록</text><path d="M180 242V274" class="edge " marker-end="url(#h10-arrow)"/><rect x="32" y="274" width="296" height="62" rx="8" class="external"/><text x="180" y="299" text-anchor="middle" class="label">model</text><text x="180" y="321" text-anchor="middle" class="small">다음 행동 생성</text><path d="M180 336V374" class="edge " marker-end="url(#h10-arrow)"/><rect x="32" y="374" width="296" height="66" rx="8" class="core"/><text x="180" y="399" text-anchor="middle" class="label">응답 처리</text><text x="180" y="421" text-anchor="middle" class="small">tool 호출 / 최종 답</text><path d="M180 440V482" class="edge " marker-end="url(#h10-arrow)"/><rect x="32" y="482" width="296" height="40" rx="8" class="hooks"/><text x="180" y="507" text-anchor="middle" class="label">PreToolUse 호출</text><path d="M180 522V548" class="edge " marker-end="url(#h10-arrow)"/><rect x="32" y="548" width="296" height="40" rx="8" class="core"/><text x="180" y="573" text-anchor="middle" class="label">권한 판단</text><path d="M180 588V605H101V620" class="edge " marker-end="url(#h10-arrow)"/><rect x="32" y="620" width="138" height="68" rx="8" class="core"/><text x="101" y="645" text-anchor="middle" class="label">tool 실행</text><text x="101" y="667" text-anchor="middle" class="small">MCP client</text><rect x="190" y="620" width="138" height="68" rx="8" class="mcp"/><text x="259" y="645" text-anchor="middle" class="label">MCP 서버</text><text x="259" y="667" text-anchor="middle" class="small">외부 tool</text><path d="M170 642H190" class="edge mcp-edge" marker-end="url(#h10-arrow)"/><path d="M190 668H170" class="edge mcp-edge" marker-end="url(#h10-arrow)"/><path d="M101 688V700H180V714" class="edge " marker-end="url(#h10-arrow)"/><rect x="32" y="714" width="296" height="40" rx="8" class="hooks"/><text x="180" y="739" text-anchor="middle" class="label">PostToolUse 호출</text><path d="M180 754V780" class="edge " marker-end="url(#h10-arrow)"/><rect x="32" y="780" width="296" height="44" rx="8" class="core"/><text x="180" y="805" text-anchor="middle" class="label">결과를 대화에 추가</text><path d="M32 802H12V222H32" class="edge " marker-end="url(#h10-arrow)"/><path d="M328 416H348V881H328" class="edge " marker-end="url(#h10-arrow)"/><rect x="32" y="864" width="296" height="36" rx="8" class="external"/><text x="180" y="889" text-anchor="middle" class="label">사용자에게 최종 답</text></svg>
