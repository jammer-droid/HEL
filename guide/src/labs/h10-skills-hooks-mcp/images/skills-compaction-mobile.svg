<svg xmlns="http://www.w3.org/2000/svg" width="360" height="760" viewBox="0 0 360 760" role="img" aria-labelledby="title desc"><title id="title">압축 전후 문맥과 별도 skill 본문</title><desc id="desc">압축 전후 문맥과 별도 skill 본문。최근 호출 순으로 본문을 선택해 요약 뒤에 별도 영역으로 보존한다.</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;fill:#24313d;font-size:14px}.title{font-size:16px;font-weight:600}.muted{fill:#536372}.line{fill:none;stroke:#778594;stroke-width:1.5}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#778594" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><rect x="8" y="8" width="344" height="162" rx="8" fill="#fff" stroke="#cbd4de"/><rect x="8" y="8" width="344" height="38" rx="8" fill="#e4efff" stroke="#cbd4de"/><text x="20" y="33" class="title" text-anchor="start">① 압축 전 model 입력</text><text x="20" y="72" class="" text-anchor="start">1. system: skill 목록</text><text x="20" y="99" class="" text-anchor="start">2~N. 대화 · tool 결과</text><text x="20" y="126" class="" text-anchor="start">여러 skill 본문 포함</text><path d="M180 172 L180 206" class="line" marker-end="url(#arrow)"/><rect x="8" y="208" width="344" height="104" rx="8" fill="#e5f3eb" stroke="#cbd4de"/><text x="22" y="236" class="title" text-anchor="start">별도 skill 보관 데이터</text><text x="22" y="264" class="" text-anchor="start">각 skill의 최신 본문 · 최근 호출 순서</text><text x="22" y="291" class="" text-anchor="start">A → B → C → D → E → F</text><path d="M180 314 L180 348" class="line" marker-end="url(#arrow)"/><rect x="8" y="350" width="344" height="164" rx="8" fill="#e4efff" stroke="#cbd4de"/><text x="22" y="378" class="title" text-anchor="start">skill 보존 영역 구성</text><text x="22" y="406" class="" text-anchor="start">최근 호출 순으로 본문 앞부분 선택</text><text x="22" y="431" class="" text-anchor="start">skill당 최대 5,000 token</text><text x="22" y="456" class="" text-anchor="start">합계 최대 25,000 token</text><text x="22" y="481" class="" text-anchor="start">예산 소진 후 나머지 skill 제외</text><path d="M180 516 L180 550" class="line" marker-end="url(#arrow)"/><rect x="8" y="552" width="344" height="196" rx="8" fill="#fff" stroke="#cbd4de"/><rect x="8" y="552" width="344" height="38" rx="8" fill="#e4efff" stroke="#cbd4de"/><text x="20" y="577" class="title" text-anchor="start">② 압축 후 model 입력</text><text x="20" y="616" class="" text-anchor="start">1. system: skill 목록</text><text x="20" y="643" class="" text-anchor="start">2. 이전 대화의 요약</text><text x="20" y="670" class="" text-anchor="start">3. 보존할 skill 본문 영역</text><text x="20" y="697" class="" text-anchor="start">4~N. 보존한 최근 대화</text></svg>
