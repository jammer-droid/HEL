<svg xmlns="http://www.w3.org/2000/svg" width="360" height="950" viewBox="0 0 360 950" role="img" aria-labelledby="title desc"><title id="title">MCP tool 로딩과 호출 전후의 model 입력</title><desc id="desc">MCP tool 로딩과 호출 전후의 model 입력. 처음에는 시스템 프롬프트에 목록만 있고 tools 배열에는 built-in과 로딩 tool만 있다. 로딩하면 tool 결과로 완료 안내가 들어가고 다음 요청부터 tools 배열에 해당 정의가 추가된다. 호출 결과는 서버 응답이 tool 메시지로 들어간다. 로딩한 이름은 harness가 따로 기록한다.</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;fill:#24313d;font-size:14px}.title{font-size:16px;font-weight:600}.sec{font-size:13px;font-weight:600;fill:#536372}.muted{fill:#536372}.new{fill:#1f6b3a;font-weight:600}.line{fill:none;stroke:#778594;stroke-width:1.5}.dash{fill:none;stroke:#778594;stroke-width:1.5;stroke-dasharray:4 3}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#778594" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><rect x="8" y="8" width="344" height="242" rx="8" fill="#fff" stroke="#cbd4de"/><rect x="8" y="8" width="344" height="38" rx="8" fill="#e4efff" stroke="#cbd4de"/><text x="20" y="33" class="title" text-anchor="start">① 처음 model 입력</text><text x="20" y="70" class="sec" text-anchor="start">메시지</text><text x="20" y="95" class="" text-anchor="start">1. system: MCP tool 목록</text><text x="20" y="120" class="" text-anchor="start">2. user: 메모 검색 요청</text><path d="M20 135 L340 135" stroke="#cbd4de"/><text x="20" y="155" class="sec" text-anchor="start">tools 배열</text><text x="20" y="180" class="" text-anchor="start">built-in · load_mcp_tool</text><path d="M180 252 L180 286" class="line" marker-end="url(#arrow)"/><rect x="8" y="290" width="344" height="242" rx="8" fill="#fff" stroke="#cbd4de"/><rect x="8" y="290" width="344" height="38" rx="8" fill="#e4efff" stroke="#cbd4de"/><text x="20" y="315" class="title" text-anchor="start">② 로딩 후</text><text x="20" y="352" class="sec" text-anchor="start">메시지</text><text x="20" y="377" class="" text-anchor="start">1~2. 목록 · 요청</text><text x="20" y="402" class="" text-anchor="start">3. assistant: load_mcp_tool</text><text x="20" y="427" class="" text-anchor="start">4. tool: 로딩 완료 안내</text><path d="M20 442 L340 442" stroke="#cbd4de"/><text x="20" y="462" class="sec" text-anchor="start">tools 배열</text><text x="20" y="487" class="" text-anchor="start">built-in · load_mcp_tool</text><text x="20" y="512" class="new" text-anchor="start">+ mcp__notes__search</text><path d="M180 534 L180 568" class="line" marker-end="url(#arrow)"/><rect x="8" y="572" width="344" height="242" rx="8" fill="#fff" stroke="#cbd4de"/><rect x="8" y="572" width="344" height="38" rx="8" fill="#e4efff" stroke="#cbd4de"/><text x="20" y="597" class="title" text-anchor="start">③ 호출 후</text><text x="20" y="634" class="sec" text-anchor="start">메시지</text><text x="20" y="659" class="" text-anchor="start">1~4. 이전 대화</text><text x="20" y="684" class="" text-anchor="start">5. assistant: search 호출</text><text x="20" y="709" class="" text-anchor="start">6. tool: 서버 결과</text><path d="M20 724 L340 724" stroke="#cbd4de"/><text x="20" y="744" class="sec" text-anchor="start">tools 배열</text><text x="20" y="769" class="" text-anchor="start">built-in · load_mcp_tool</text><text x="20" y="794" class="" text-anchor="start">mcp__notes__search</text><rect x="8" y="834" width="344" height="104" rx="8" fill="#e5f3eb" stroke="#cbd4de"/><text x="24" y="860" class="title" text-anchor="start">로딩 기록</text><text x="24" y="887" class="" text-anchor="start">mcp__notes__search</text><text x="24" y="912" class="" text-anchor="start">이 세션 안에서만 유지</text></svg>