<svg xmlns="http://www.w3.org/2000/svg" width="736" height="348" viewBox="0 0 736 348" role="img" aria-labelledby="title desc"><title id="title">skill 읽기 전후 model 입력과 별도 보관 데이터</title><desc id="desc">skill 읽기 전후 model 입력과 별도 보관 데이터。첫 읽기에는 본문을 전달하고 같은 본문이 문맥에 남아 있으면 이미 로딩됨을 반환한다.</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;fill:#24313d;font-size:14px}.title{font-size:16px;font-weight:600}.muted{fill:#536372}.line{fill:none;stroke:#778594;stroke-width:1.5}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#778594" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><rect x="0" y="12" width="228" height="198" rx="8" fill="#fff" stroke="#cbd4de"/><rect x="0" y="12" width="228" height="38" rx="8" fill="#e4efff" stroke="#cbd4de"/><text x="12" y="37" class="title" text-anchor="start">① 처음 model 입력</text><text x="12" y="76" class="" text-anchor="start">1. system: skill 목록 v1</text><text x="12" y="103" class="" text-anchor="start">2. user: 리뷰 요청</text><rect x="254" y="12" width="228" height="198" rx="8" fill="#fff" stroke="#cbd4de"/><rect x="254" y="12" width="228" height="38" rx="8" fill="#e4efff" stroke="#cbd4de"/><text x="266" y="37" class="title" text-anchor="start">② 첫 skill 읽기 후</text><text x="266" y="76" class="" text-anchor="start">1. system: skill 목록 v1</text><text x="266" y="103" class="" text-anchor="start">2. user: 리뷰 요청</text><text x="266" y="130" class="" text-anchor="start">3. assistant: read_file 요청</text><text x="266" y="157" class="" text-anchor="start">4. tool: review 본문 v1</text><rect x="508" y="12" width="228" height="198" rx="8" fill="#fff" stroke="#cbd4de"/><rect x="508" y="12" width="228" height="38" rx="8" fill="#e4efff" stroke="#cbd4de"/><text x="520" y="37" class="title" text-anchor="start">③ 같은 skill 재요청 후</text><text x="520" y="76" class="" text-anchor="start">1. system: skill 목록 v1</text><text x="520" y="103" class="" text-anchor="start">2~4. 이전 대화 · 본문 v1</text><text x="520" y="130" class="" text-anchor="start">5. assistant: read_file 요청</text><text x="520" y="157" class="" text-anchor="start">6. tool: 이미 로딩됨</text><path d="M230 110 L250 110" class="line" marker-end="url(#arrow)"/><path d="M484 110 L504 110" class="line" marker-end="url(#arrow)"/><rect x="254" y="256" width="482" height="80" rx="8" fill="#e5f3eb" stroke="#cbd4de"/><text x="270" y="282" class="title" text-anchor="start">별도 skill 보관 데이터</text><text x="270" y="309" class="" text-anchor="start">review 본문 v1 · 최근 호출 순서</text><path d="M368 212 L368 254" class="line" marker-end="url(#arrow)"/><path d="M622 212 L622 254" class="line" marker-end="url(#arrow)"/></svg>
