<svg xmlns="http://www.w3.org/2000/svg" width="736" height="448" viewBox="0 0 736 448" role="img" aria-labelledby="title desc"><title id="title">세션 재개와 skill 변경 반영</title><desc id="desc">세션 재개와 skill 변경 반영。snapshot의 skill 데이터를 복원하고, read_file 재요청 때 수정된 파일을 읽어 목록과 본문을 갱신한다.</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;fill:#24313d;font-size:14px}.title{font-size:16px;font-weight:600}.muted{fill:#536372}.line{fill:none;stroke:#778594;stroke-width:1.5}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#778594" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><rect x="0" y="4" width="340" height="78" rx="8" fill="#e5f3eb" stroke="#cbd4de"/><text x="16" y="30" class="title" text-anchor="start">세션 snapshot</text><text x="16" y="57" class="" text-anchor="start">skill 목록 v1 · 대화 · 보관 본문 v1</text><rect x="396" y="4" width="340" height="78" rx="8" fill="#fff0dc" stroke="#cbd4de"/><text x="412" y="30" class="title" text-anchor="start">현재 저장소의 skill 파일</text><text x="412" y="57" class="" text-anchor="start">이름·설명·본문을 수정한 v2</text><path d="M170 84 L170 122" class="line" marker-end="url(#arrow)"/><path d="M566 84 L566 122" class="line" marker-end="url(#arrow)"/><rect x="0" y="124" width="340" height="198" rx="8" fill="#fff" stroke="#cbd4de"/><rect x="0" y="124" width="340" height="38" rx="8" fill="#e4efff" stroke="#cbd4de"/><text x="12" y="149" class="title" text-anchor="start">① 세션 재개 후 model 입력</text><text x="12" y="188" class="" text-anchor="start">1. system: 복원한 skill 목록 v1</text><text x="12" y="215" class="" text-anchor="start">2. user: 이전 리뷰 요청</text><text x="12" y="242" class="" text-anchor="start">3. assistant: 이전 읽기 요청</text><text x="12" y="269" class="" text-anchor="start">4. tool: review 본문 v1</text><rect x="396" y="124" width="340" height="198" rx="8" fill="#fff" stroke="#cbd4de"/><rect x="396" y="124" width="340" height="38" rx="8" fill="#e4efff" stroke="#cbd4de"/><text x="408" y="149" class="title" text-anchor="start">② skill을 다시 읽은 뒤 model 입력</text><text x="408" y="188" class="" text-anchor="start">1. system: 갱신한 skill 목록 v2</text><text x="408" y="215" class="" text-anchor="start">2~4. 이전 대화 · 본문 v1</text><text x="408" y="242" class="" text-anchor="start">5. assistant: 다시 읽기 요청</text><text x="408" y="269" class="" text-anchor="start">6. tool: 최신 review 본문 v2</text><path d="M342 220 L394 220" class="line" marker-end="url(#arrow)"/><rect x="396" y="366" width="340" height="70" rx="8" fill="#e5f3eb" stroke="#cbd4de"/><text x="412" y="392" class="title" text-anchor="start">별도 보관 본문도 v2로 갱신</text><text x="412" y="417" class="" text-anchor="start">이전 대화는 유지 · 새 본문 추가</text><path d="M566 324 L566 364" class="line" marker-end="url(#arrow)"/></svg>
