<svg xmlns="http://www.w3.org/2000/svg" width="900" height="506" viewBox="0 0 900 506" role="img" aria-labelledby="title desc">
<title id="title">DeepSeek cache 저장소와 부모·자식 요청</title><desc id="desc">부모 요청 1과 2가 남긴 앞부분을 자식 요청과 이후 부모 요청이 내용으로 찾아 hit한다. 위임 지시만 받는 자식은 시스템 프롬프트만 hit되고 위임 작업부터 miss다. 자식의 단위는 부모의 단위를 지우지 않는다.</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;fill:#26323b;font-size:15px}
.h{font-size:19px;font-weight:600}.lbl{font-size:15px;font-weight:600}.s{font-size:13px;fill:#52616c}.b{font-size:13px}
.hit{fill:#dff3e4;stroke:#5fa877;stroke-width:1.5}.miss{fill:#ffffff;stroke:#a9b4bc;stroke-width:1.2}
.out{fill:#fff1d6;stroke:#d5ab66;stroke-width:1.2;stroke-dasharray:4 3}.panel{fill:#f4f6f7;stroke:#d6dce0}
.unitp{fill:#ffffff;stroke:#7b8790}.unitc{fill:#ffffff;stroke:#7b8790;stroke-dasharray:4 3}.line{fill:none;stroke:#5fa877;stroke-width:1.5}</style>
<rect width="900" height="506" rx="12" fill="#ffffff"/>
<text x="28" y="38" class="h">요청 순서</text><rect x="28" y="52" width="22" height="16" rx="3" class="hit"/><text x="56" y="65" class="s">cache hit</text><rect x="146" y="52" width="22" height="16" rx="3" class="miss"/><text x="174" y="65" class="s">cache miss</text><rect x="264" y="52" width="22" height="16" rx="3" class="out"/><text x="292" y="65" class="s">model 출력</text><text x="28" y="115" class="lbl">부모 요청 1</text><rect x="140" y="96" width="30" height="28" rx="5" class="miss"/><text x="155.0" y="115" text-anchor="middle" class="b">1</text><rect x="174" y="96" width="30" height="28" rx="5" class="miss"/><text x="189.0" y="115" text-anchor="middle" class="b">2</text><rect x="208" y="96" width="30" height="28" rx="5" class="out"/><text x="223.0" y="115" text-anchor="middle" class="b">3</text><text x="140" y="144" class="s">hit 없음 (첫 요청) → 저장 1~2, 1~3</text><text x="28" y="193" class="lbl">부모 요청 2</text><rect x="140" y="174" width="30" height="28" rx="5" class="hit"/><text x="155.0" y="193" text-anchor="middle" class="b">1</text><rect x="174" y="174" width="30" height="28" rx="5" class="hit"/><text x="189.0" y="193" text-anchor="middle" class="b">2</text><rect x="208" y="174" width="30" height="28" rx="5" class="hit"/><text x="223.0" y="193" text-anchor="middle" class="b">3</text><rect x="242" y="174" width="30" height="28" rx="5" class="miss"/><text x="257.0" y="193" text-anchor="middle" class="b">4</text><rect x="276" y="174" width="30" height="28" rx="5" class="out"/><text x="291.0" y="193" text-anchor="middle" class="b">5</text><text x="140" y="222" class="s">1~3 hit (요청 1의 1~3) · 4 miss → 저장 1~4, 1~5</text><text x="28" y="271" class="lbl">자식 요청 1</text><text x="28" y="290" class="s">전체 복사</text><rect x="140" y="252" width="30" height="28" rx="5" class="hit"/><text x="155.0" y="271" text-anchor="middle" class="b">1</text><rect x="174" y="252" width="30" height="28" rx="5" class="hit"/><text x="189.0" y="271" text-anchor="middle" class="b">2</text><rect x="208" y="252" width="30" height="28" rx="5" class="hit"/><text x="223.0" y="271" text-anchor="middle" class="b">3</text><rect x="242" y="252" width="30" height="28" rx="5" class="hit"/><text x="257.0" y="271" text-anchor="middle" class="b">4</text><rect x="276" y="252" width="44" height="28" rx="5" class="miss"/><text x="298.0" y="271" text-anchor="middle" class="b">위임</text><rect x="324" y="252" width="44" height="28" rx="5" class="out"/><text x="346.0" y="271" text-anchor="middle" class="b">c1</text><text x="140" y="300" class="s">1~4 hit (부모 요청 2의 1~4) · 위임 miss → 저장 1~4+위임, 이후 자식 요청</text><text x="28" y="349" class="lbl">자식 요청 1</text><text x="28" y="368" class="s">위임 지시만</text><rect x="140" y="330" width="30" height="28" rx="5" class="hit"/><text x="155.0" y="349" text-anchor="middle" class="b">1</text><rect x="174" y="330" width="44" height="28" rx="5" class="miss"/><text x="196.0" y="349" text-anchor="middle" class="b">위임</text><rect x="222" y="330" width="44" height="28" rx="5" class="out"/><text x="244.0" y="349" text-anchor="middle" class="b">c1</text><text x="140" y="378" class="s">시스템 프롬프트만 hit · 위임 작업부터 miss → 저장 1+위임, 이후 자식 요청</text><text x="28" y="427" class="lbl">부모 요청 3</text><text x="28" y="446" class="s">자식이 끝난 뒤</text><rect x="140" y="408" width="30" height="28" rx="5" class="hit"/><text x="155.0" y="427" text-anchor="middle" class="b">1</text><rect x="174" y="408" width="30" height="28" rx="5" class="hit"/><text x="189.0" y="427" text-anchor="middle" class="b">2</text><rect x="208" y="408" width="30" height="28" rx="5" class="hit"/><text x="223.0" y="427" text-anchor="middle" class="b">3</text><rect x="242" y="408" width="30" height="28" rx="5" class="hit"/><text x="257.0" y="427" text-anchor="middle" class="b">4</text><rect x="276" y="408" width="30" height="28" rx="5" class="hit"/><text x="291.0" y="427" text-anchor="middle" class="b">5</text><rect x="310" y="408" width="30" height="28" rx="5" class="miss"/><text x="325.0" y="427" text-anchor="middle" class="b">6</text><rect x="344" y="408" width="30" height="28" rx="5" class="out"/><text x="359.0" y="427" text-anchor="middle" class="b">답</text><text x="140" y="456" class="s">1~5 hit (부모 요청 2의 1~5) · 6 miss → 저장 1~6, 1~답</text><rect x="560" y="30" width="312" height="338" rx="10" class="panel"/><text x="576" y="58" class="lbl">cache 저장소 (같은 API key)</text><text x="576" y="78" class="s">앞부분 내용으로 찾음 · 보낸 agent는 구분 없음</text><rect x="574" y="92" width="284" height="32" rx="6" class="unitp"/><text x="586" y="113" class="b">1~2</text><text x="846" y="113" text-anchor="end" class="s">부모</text><rect x="574" y="132" width="284" height="32" rx="6" class="unitp"/><text x="586" y="153" class="b">1~3</text><text x="846" y="153" text-anchor="end" class="s">부모</text><rect x="574" y="172" width="284" height="32" rx="6" class="unitp"/><text x="586" y="193" class="b">1~4</text><text x="846" y="193" text-anchor="end" class="s">부모</text><rect x="574" y="212" width="284" height="32" rx="6" class="unitp"/><text x="586" y="233" class="b">1~5</text><text x="846" y="233" text-anchor="end" class="s">부모</text><rect x="574" y="252" width="284" height="32" rx="6" class="unitc"/><text x="586" y="273" class="b">1~4+위임 …</text><text x="846" y="273" text-anchor="end" class="s">자식(전체 복사)</text><rect x="574" y="292" width="284" height="32" rx="6" class="unitc"/><text x="586" y="313" class="b">1+위임 …</text><text x="846" y="313" text-anchor="end" class="s">자식(위임 지시만)</text><rect x="574" y="332" width="284" height="32" rx="6" class="unitp"/><text x="586" y="353" class="b">1~6, 1~답</text><text x="846" y="353" text-anchor="end" class="s">부모</text></svg>
