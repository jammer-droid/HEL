<svg xmlns="http://www.w3.org/2000/svg" width="380" height="1014" viewBox="0 0 380 1014" role="img" aria-labelledby="title desc">
<title id="title">DeepSeek cache 저장소와 부모·자식 요청</title><desc id="desc">부모 요청 1과 2가 남긴 앞부분을 자식 요청과 이후 부모 요청이 내용으로 찾아 hit한다. 위임 지시만 받는 자식은 시스템 프롬프트만 hit되고 위임 작업부터 miss다. 자식의 단위는 부모의 단위를 지우지 않는다.</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;fill:#26323b;font-size:15px}
.h{font-size:19px;font-weight:600}.lbl{font-size:15px;font-weight:600}.s{font-size:13px;fill:#52616c}.b{font-size:13px}
.hit{fill:#dff3e4;stroke:#5fa877;stroke-width:1.5}.miss{fill:#ffffff;stroke:#a9b4bc;stroke-width:1.2}
.out{fill:#fff1d6;stroke:#d5ab66;stroke-width:1.2;stroke-dasharray:4 3}.panel{fill:#f4f6f7;stroke:#d6dce0}
.unitp{fill:#ffffff;stroke:#7b8790}.unitc{fill:#ffffff;stroke:#7b8790;stroke-dasharray:4 3}.line{fill:none;stroke:#5fa877;stroke-width:1.5}</style>
<rect width="380" height="1014" rx="12" fill="#ffffff"/>
<text x="16" y="34" class="h">요청 순서</text><rect x="16" y="46" width="22" height="16" rx="3" class="hit"/><text x="44" y="59" class="s">cache hit</text><rect x="134" y="46" width="22" height="16" rx="3" class="miss"/><text x="162" y="59" class="s">cache miss</text><rect x="252" y="46" width="22" height="16" rx="3" class="out"/><text x="280" y="59" class="s">model 출력</text><text x="16" y="100" class="lbl">부모 요청 1</text><rect x="16" y="110" width="28" height="28" rx="5" class="miss"/><text x="30.0" y="129" text-anchor="middle" class="b">1</text><rect x="48" y="110" width="28" height="28" rx="5" class="miss"/><text x="62.0" y="129" text-anchor="middle" class="b">2</text><rect x="80" y="110" width="28" height="28" rx="5" class="out"/><text x="94.0" y="129" text-anchor="middle" class="b">3</text><text x="16" y="158" class="s">hit 없음 (첫 요청)</text><text x="16" y="176" class="s">→ 저장 1~2, 1~3</text><text x="16" y="214" class="lbl">부모 요청 2</text><rect x="16" y="224" width="28" height="28" rx="5" class="hit"/><text x="30.0" y="243" text-anchor="middle" class="b">1</text><rect x="48" y="224" width="28" height="28" rx="5" class="hit"/><text x="62.0" y="243" text-anchor="middle" class="b">2</text><rect x="80" y="224" width="28" height="28" rx="5" class="hit"/><text x="94.0" y="243" text-anchor="middle" class="b">3</text><rect x="112" y="224" width="28" height="28" rx="5" class="miss"/><text x="126.0" y="243" text-anchor="middle" class="b">4</text><rect x="144" y="224" width="28" height="28" rx="5" class="out"/><text x="158.0" y="243" text-anchor="middle" class="b">5</text><text x="16" y="272" class="s">1~3 hit (요청 1의 1~3) · 4 miss</text><text x="16" y="290" class="s">→ 저장 1~4, 1~5</text><text x="16" y="328" class="lbl">자식 요청 1</text><text x="131" y="328" class="s">전체 복사</text><rect x="16" y="338" width="28" height="28" rx="5" class="hit"/><text x="30.0" y="357" text-anchor="middle" class="b">1</text><rect x="48" y="338" width="28" height="28" rx="5" class="hit"/><text x="62.0" y="357" text-anchor="middle" class="b">2</text><rect x="80" y="338" width="28" height="28" rx="5" class="hit"/><text x="94.0" y="357" text-anchor="middle" class="b">3</text><rect x="112" y="338" width="28" height="28" rx="5" class="hit"/><text x="126.0" y="357" text-anchor="middle" class="b">4</text><rect x="144" y="338" width="42" height="28" rx="5" class="miss"/><text x="165.0" y="357" text-anchor="middle" class="b">위임</text><rect x="190" y="338" width="42" height="28" rx="5" class="out"/><text x="211.0" y="357" text-anchor="middle" class="b">c1</text><text x="16" y="386" class="s">1~4 hit (부모 요청 2의 1~4) · 위임 miss</text><text x="16" y="404" class="s">→ 저장 1~4+위임, 이후 자식 요청</text><text x="16" y="442" class="lbl">자식 요청 1</text><text x="131" y="442" class="s">위임 지시만</text><rect x="16" y="452" width="28" height="28" rx="5" class="hit"/><text x="30.0" y="471" text-anchor="middle" class="b">1</text><rect x="48" y="452" width="42" height="28" rx="5" class="miss"/><text x="69.0" y="471" text-anchor="middle" class="b">위임</text><rect x="94" y="452" width="42" height="28" rx="5" class="out"/><text x="115.0" y="471" text-anchor="middle" class="b">c1</text><text x="16" y="500" class="s">시스템 프롬프트만 hit · 위임 작업부터 miss</text><text x="16" y="518" class="s">→ 저장 1+위임, 이후 자식 요청</text><text x="16" y="556" class="lbl">부모 요청 3</text><text x="131" y="556" class="s">자식이 끝난 뒤</text><rect x="16" y="566" width="28" height="28" rx="5" class="hit"/><text x="30.0" y="585" text-anchor="middle" class="b">1</text><rect x="48" y="566" width="28" height="28" rx="5" class="hit"/><text x="62.0" y="585" text-anchor="middle" class="b">2</text><rect x="80" y="566" width="28" height="28" rx="5" class="hit"/><text x="94.0" y="585" text-anchor="middle" class="b">3</text><rect x="112" y="566" width="28" height="28" rx="5" class="hit"/><text x="126.0" y="585" text-anchor="middle" class="b">4</text><rect x="144" y="566" width="28" height="28" rx="5" class="hit"/><text x="158.0" y="585" text-anchor="middle" class="b">5</text><rect x="176" y="566" width="28" height="28" rx="5" class="miss"/><text x="190.0" y="585" text-anchor="middle" class="b">6</text><rect x="208" y="566" width="28" height="28" rx="5" class="out"/><text x="222.0" y="585" text-anchor="middle" class="b">답</text><text x="16" y="614" class="s">1~5 hit (부모 요청 2의 1~5) · 6 miss</text><text x="16" y="632" class="s">→ 저장 1~6, 1~답</text><rect x="16" y="660" width="348" height="338" rx="10" class="panel"/><text x="32" y="688" class="lbl">cache 저장소 (같은 API key)</text><text x="32" y="708" class="s">앞부분 내용으로 찾음 · 보낸 agent는 구분 없음</text><rect x="30" y="722" width="320" height="32" rx="6" class="unitp"/><text x="42" y="743" class="b">1~2</text><text x="338" y="743" text-anchor="end" class="s">부모</text><rect x="30" y="762" width="320" height="32" rx="6" class="unitp"/><text x="42" y="783" class="b">1~3</text><text x="338" y="783" text-anchor="end" class="s">부모</text><rect x="30" y="802" width="320" height="32" rx="6" class="unitp"/><text x="42" y="823" class="b">1~4</text><text x="338" y="823" text-anchor="end" class="s">부모</text><rect x="30" y="842" width="320" height="32" rx="6" class="unitp"/><text x="42" y="863" class="b">1~5</text><text x="338" y="863" text-anchor="end" class="s">부모</text><rect x="30" y="882" width="320" height="32" rx="6" class="unitc"/><text x="42" y="903" class="b">1~4+위임 …</text><text x="338" y="903" text-anchor="end" class="s">자식(전체 복사)</text><rect x="30" y="922" width="320" height="32" rx="6" class="unitc"/><text x="42" y="943" class="b">1+위임 …</text><text x="338" y="943" text-anchor="end" class="s">자식(위임 지시만)</text><rect x="30" y="962" width="320" height="32" rx="6" class="unitp"/><text x="42" y="983" class="b">1~6, 1~답</text><text x="338" y="983" text-anchor="end" class="s">부모</text></svg>
